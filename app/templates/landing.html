<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<base href="/xkx/">
<title>🦞 享客虾 · AI 创作伙伴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;
  background:#F8F6F2;color:#2C2C2C;min-height:100vh;line-height:1.6;
  -webkit-font-smoothing:antialiased
}
.container{max-width:420px;margin:0 auto;padding:0 20px 40px;text-align:center}

/* Hero */
.hero{padding:36px 0 8px}
.hero .logo{
  display:inline-flex;align-items:center;justify-content:center;
  width:76px;height:76px;border-radius:50%;
  background:linear-gradient(135deg,#C0392B,#A93226);
  box-shadow:0 4px 20px rgba(192,57,43,.2);margin-bottom:6px
}
.hero .logo .emoji{font-size:40px;line-height:1}
.hero h1{font-size:28px;font-weight:800;color:#1a1a1a;letter-spacing:1px}
.hero .tagline{
  font-size:13px;color:#C0392B;margin-top:2px;font-weight:500;
  background:rgba(192,57,43,.06);display:inline-block;padding:2px 14px;border-radius:20px
}

/* Badge */
.price-badge{
  display:inline-block;margin:12px auto 0;
  background:linear-gradient(135deg,#fff5f2,#fff);
  border:1px solid rgba(192,57,43,.1);border-radius:20px;
  padding:4px 16px;font-size:12px;color:#C0392B
}

/* CTA */
.cta-wrap{margin:24px 0 28px}
.btn-primary{
  display:block;width:100%;padding:18px;border-radius:16px;border:none;
  background:linear-gradient(135deg,#C0392B,#A93226);color:#fff;
  font-size:18px;font-weight:700;cursor:pointer;transition:all .15s;
  letter-spacing:1.5px;box-shadow:0 4px 16px rgba(192,57,43,.25)
}
.btn-primary:active{transform:scale(.97)}

/* Features */
.features{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.feature{
  display:flex;align-items:center;gap:12px;
  background:#fff;border-radius:12px;padding:14px 16px;
  border:1px solid #f0ebe4;text-align:left
}
.feature .f{font-size:24px;width:32px;text-align:center}
.feature .t{flex:1}
.feature .t strong{display:block;font-size:15px;color:#1a1a1a}
.feature .t span{font-size:13px;color:#999}

/* Pricing info */
.pricing{background:#fff;border-radius:14px;padding:16px;border:1px solid #f0ebe4;margin-bottom:24px}
.pricing .pr{font-size:12px;color:#bbb;margin-bottom:10px;letter-spacing:2px}
.price-row{display:flex;gap:10px}
.price-item{flex:1;padding:12px 8px;border-radius:10px;background:#faf8f6}
.price-item .a{font-size:24px;font-weight:800;color:#C0392B}
.price-item .a small{font-size:12px;color:#999;font-weight:400}
.price-item .d{font-size:12px;color:#888;margin-top:2px}
.price-item.highlight{background:#fff5f2;border:1px solid rgba(192,57,43,.12)}

/* QR (非微信) */
.qr-section{display:none;padding:24px 16px;background:#fff;border-radius:14px;border:1px solid #f0ebe4;margin-bottom:16px}
.qr-section.show{display:block}
.qr-section img{width:170px;height:170px;border-radius:10px;margin:8px auto}

/* Footer */
.footer{padding:20px 0 0;font-size:11px;color:#ccc}
</style>
</head>
<body>
<div class="container">

  <!-- Hero -->
  <div class="hero">
    <div class="logo"><span class="emoji">🦞</span></div>
    <h1>享客虾</h1>
    <div class="tagline">AI · 创作伙伴</div>
    <div class="price-badge">🦞 免费浏览全部作品案例</div>
  </div>

  <!-- CTA -->
  <div class="cta-wrap">
    <button class="btn-primary" onclick="addBot()">🦞 添加享客虾 Bot</button>
  </div>

  <!-- Features -->
  <div class="features">
    <div class="feature">
      <div class="f">🎵</div>
      <div class="t"><strong>AI 写歌</strong><span>说句话，AI 为你创作原创歌曲</span></div>
    </div>
    <div class="feature">
      <div class="f">🎬</div>
      <div class="t"><strong>照片 MV</strong><span>传照片 → 识图配诗 → 配乐 → 出片</span></div>
    </div>
    <div class="feature">
      <div class="f">🎤</div>
      <div class="t"><strong>声音克隆</strong><span>用你的声音唱任何歌</span></div>
    </div>
    <div class="feature">
      <div class="f">🦞</div>
      <div class="t"><strong>AI 对话</strong><span>懂音乐的创作伙伴，无所不聊</span></div>
    </div>
  </div>

  <!-- Pricing -->
  <div class="pricing">
    <div class="pr">会 员 方 案</div>
    <div class="price-row">
      <div class="price-item">
        <div class="a">¥99 <small>/月</small></div>
        <div class="d">10000 虾点/月 · 无限对话</div>
      </div>
      <div class="price-item highlight">
        <div class="a">¥999 <small>/年</small></div>
        <div class="d">120000 虾点/年 · 省¥189</div>
      </div>
    </div>
  </div>

  <!-- QR fallback -->
  <div class="qr-section" id="qrSection">
    <p style="font-size:14px;color:#888;margin-bottom:6px">微信扫码添加享客虾 Bot</p>
    <img id="qrImg" src="" alt="二维码">
  </div>

  <div class="footer">🦞 享客虾 · AI 传薪计划 · 智享家出品</div>
</div>

<script>
(function(){
  var isWx = /MicroMessenger/i.test(navigator.userAgent);
  if (!isWx) {
    document.getElementById('qrSection').classList.add('show');
    document.getElementById('qrImg').src = '/api/bot/qrcode/image?t=' + Date.now();
  }
})();

function addBot() {
  if (/MicroMessenger/i.test(navigator.userAgent)) {
    // 微信内 → 跳转绑定页（已有扫码激活流程）
    window.location.href = '/xkx/bind';
  } else {
    // 非微信 → 展示二维码
    document.getElementById('qrSection').classList.add('show');
    document.getElementById('qrSection').scrollIntoView({behavior:'smooth', block:'center'});
  }
}
</script>
</body>
</html>
