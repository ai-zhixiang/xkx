<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<base href="/xkx/">
<title>添加享客虾 · Bot 绑定</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(180deg,#F8F6F2 0%,#FFF 40%,#FFF 100%);
  color:#2C2C2C;min-height:100vh;line-height:1.6;
  -webkit-font-smoothing:antialiased
}
.container{max-width:420px;margin:0 auto;padding:24px 20px 40px;text-align:center}

/* Back link */
.back{text-align:left;font-size:13px;color:#aaa;margin-bottom:8px;cursor:pointer;display:inline-block}
.back:hover{color:#C0392B}

/* Header */
.header{margin-bottom:20px}
.header .icon{font-size:48px}
.header h2{font-size:20px;font-weight:700;color:#1a1a1a;margin-top:6px}

/* Profile card */
.profile-card{
  background:#fff;border-radius:16px;padding:20px;margin-bottom:20px;
  border:1px solid rgba(192,57,43,.06);box-shadow:0 2px 12px rgba(0,0,0,.04);
  display:none
}
.profile-card.show{display:block;animation:fadeUp .4s ease-out}
.profile-card .avatar{width:56px;height:56px;border-radius:50%;border:2px solid #C0392B;padding:2px;margin:0 auto 8px}
.profile-card .avatar img{width:100%;height:100%;border-radius:50%;display:block}
.profile-card .name{font-size:18px;font-weight:700;color:#1a1a1a}
.profile-card .badge{font-size:12px;color:#27AE60;margin-top:4px}
.profile-card .badge .check{display:inline-block;width:16px;height:16px;background:#27AE60;border-radius:50%;color:#fff;font-size:10px;line-height:16px;text-align:center;margin-right:3px}

/* Bot CTA (微信内) */
.bot-cta{
  background:#fff;border-radius:16px;padding:24px 20px 20px;
  border:1px solid rgba(192,57,43,.06);box-shadow:0 2px 12px rgba(0,0,0,.04);
  margin-bottom:16px;display:none
}
.bot-cta.show{display:block;animation:fadeUp .4s ease-out}
.bot-cta p{font-size:14px;color:#888;margin-bottom:16px;line-height:1.7}
.btn-primary{
  display:block;width:100%;padding:16px;border-radius:14px;border:none;
  background:linear-gradient(135deg,#C0392B,#A93226);color:#fff;
  font-size:17px;font-weight:700;cursor:pointer;transition:all .2s;
  letter-spacing:1px;box-shadow:0 4px 12px rgba(192,57,43,.25)
}
.btn-primary:active{transform:scale(.97)}

/* QR (非微信) */
.qr-box{
  display:none;background:#fff;border-radius:16px;padding:24px 20px 20px;margin-bottom:16px;
  border:1px solid rgba(192,57,43,.06);box-shadow:0 2px 12px rgba(0,0,0,.04)
}
.qr-box.show{display:block}
.qr-box .qr-wrap{width:200px;height:200px;margin:8px auto 12px;border-radius:12px;overflow:hidden}
.qr-box .qr-wrap img{width:100%;height:100%;object-fit:contain;display:block}
.qr-loading{font-size:13px;color:#bbb;padding:80px 0}
.step-list{text-align:left;margin-top:12px}
.step-list li{font-size:13px;color:#888;padding:5px 0;list-style:none;line-height:1.7}
.step-list li:before{content:'① ';color:#C0392B}
.step-list li:nth-child(2):before{content:'② '}
.step-list li:nth-child(3):before{content:'③ '}

/* Status */
.msg{padding:12px 16px;border-radius:10px;margin-bottom:16px;display:none;font-size:13px;line-height:1.5}
.msg.success{display:block;background:rgba(39,174,96,.07);color:#27AE60;border:1px solid rgba(39,174,96,.12)}
.msg.error{display:block;background:rgba(192,57,43,.05);color:#C0392B;border:1px solid rgba(192,57,43,.08)}
.msg.info{display:block;background:rgba(212,168,71,.06);color:#b89230;border:1px solid rgba(212,168,71,.12);font-weight:600}

/* Footer */
.footer{font-size:11px;color:#ccc;margin-top:24px}

/* Referrer */
.referrer{display:flex;align-items:center;gap:12px;margin:0 0 20px;padding:14px;background:#f0f7f0;border-radius:12px;text-align:left}
.referrer .rf-av{flex-shrink:0;width:44px;height:44px;border-radius:50%;overflow:hidden}
.referrer .rf-av img{width:100%;height:100%;object-fit:cover}
.referrer .rf-name{font-size:16px;font-weight:600;color:#3a3226}
.referrer .rf-action{font-size:12px;color:#5B8C3E;margin-top:2px}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">

  <div style="text-align:left"><span class="back" onclick="history.back()">← 返回</span></div>

  <div class="header">
    <div class="icon">🦞</div>
    <h2 id="pageTitle">添加享客虾 Bot</h2>
  </div>

  <div class="referrer" id="refInfo" style="display:none"></div>

  <!-- Profile card -->
  <div class="profile-card" id="profileCard">
    <div class="avatar"><img id="userAvatar" src="" alt="头像"></div>
    <div class="name" id="userNickname"></div>
    <div class="badge"><span class="check">✓</span> 微信授权成功</div>
  </div>

  <!-- Status messages -->
  <div class="msg" id="statusMsg"></div>

  <!-- ====== 微信内：直接添加 Bot ====== -->
  <div class="bot-cta" id="botCta">
    <p>点击下方按钮，在微信中添加享客虾为好友<br>添加后即可开始使用 🦞</p>
    <button class="btn-primary" onclick="addBotDirect()">🦞 添加享客虾 Bot</button>
  </div>

  <!-- ====== 非微信：二维码 ====== -->
  <div class="qr-box" id="qrBox">
    <p style="font-size:14px;color:#888;margin-bottom:8px">微信扫码添加享客虾为好友</p>
    <div class="qr-wrap">
      <div class="qr-loading" id="qrLoading">正在生成二维码...</div>
      <img id="qrImg" src="" alt="二维码" style="display:none">
    </div>
    <ul class="step-list">
      <li>打开微信「扫一扫」</li>
      <li>扫描二维码添加 Bot</li>
      <li>Bot 将发送欢迎消息</li>
    </ul>
  </div>

  <div class="footer">🦞 享客虾 · AI 创作伙伴</div>
</div>

<script>
var userInfo = {openid: '', nickname: '', avatar: ''};
var isInWx = /MicroMessenger/i.test(navigator.userAgent);

function loadReferrerInfo(code) {
  if (!code) return;
  var x = new XMLHttpRequest();
  x.open('GET', 'https://ai.pangoozn.com/promo/referral/info?code=' + encodeURIComponent(code), true);
  x.onreadystatechange = function() {
    if (x.readyState == 4 && x.status == 200) {
      try {
        var d = JSON.parse(x.responseText);
        var nick = d.nickname || '虾客';
        var av = d.avatar_url || '';
        var avHtml = av ? '<img src=\"' + av + '\">' : '<div style=\"width:44px;height:44px;border-radius:50%;background:#5B8C3E;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px\">🦞</div>';
        var el = document.getElementById('refInfo');
        el.innerHTML = '<div class=\"rf-av\">' + avHtml + '</div><div><div class=\"rf-name\">' + nick + '</div><div class=\"rf-action\">邀您开通 · 享客虾</div></div>';
        el.style.display = 'flex';
      } catch(e){}
    }
  };
  x.send();
}

(function init() {
  var params = new URLSearchParams(location.search);
  var pOpenid = params.get('openid') || '';
  var pNick = params.get('nickname') || '';
  var pAvatar = params.get('avatar') || '';
  var pSync = params.get('sync') || '';
  var pRef = params.get('ref') || '';

  // 保存 ref 到 localStorage（OAuth 跳转后还在）
  if (pRef) {
    try { localStorage.setItem('referral_code', pRef); } catch(e){}
    loadReferrerInfo(pRef);
  }

  // 来自 OAuth 回调
  if (pSync === 'ok' && pOpenid) {
    userInfo = {openid: pOpenid, nickname: pNick || '', avatar: pAvatar || ''};
    try {
      localStorage.setItem('wx_openid', pOpenid);
      if (pNick) localStorage.setItem('wx_nickname', pNick);
      if (pAvatar) localStorage.setItem('wx_avatar', pAvatar);
    } catch(e){}
    // OAuth 回调：写昵称+头像到 DB
    if (pNick) {
      fetch('/api/user/profile', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({openid: pOpenid, nickname: pNick, avatar: pAvatar || ''})
      }).catch(function(){});
    }
    showProfile();
    window.history.replaceState({}, '', location.href.split('?')[0]);
    checkMembership(pOpenid);
    afterAuth();
    bindReferral(pOpenid);
    // OAuth 后从 localStorage 恢复 ref 显示
    var savedRef = '';
    try { savedRef = localStorage.getItem('referral_code') || ''; } catch(e){}
    if (savedRef) loadReferrerInfo(savedRef);
    return;
  }

  // 从 localStorage 恢复
  try {
    var storedOpenid = localStorage.getItem('wx_openid') || '';
    if (storedOpenid) {
      userInfo.openid = storedOpenid;
      userInfo.nickname = localStorage.getItem('wx_nickname') || '';
      userInfo.avatar = localStorage.getItem('wx_avatar') || '';
      if (userInfo.openid) showProfile();
    }
  } catch(e){}

  // 微信内无 openid → 自动 OAuth（保留 ref 参数）
  if (!userInfo.openid && isInWx) {
    var refParam = pRef || (function(){try{return localStorage.getItem('referral_code')||''}catch(e){return ''}})();
    var cbUrl = window.location.origin + '/xkx/bind' + (refParam ? '?ref=' + encodeURIComponent(refParam) : '');
    var cb = encodeURIComponent(cbUrl);
    window.location.href = 'https://ai.pangoozn.com/api/auth-center/api/auth/wechat-redirect?direct=1&target=' + cb + '&source=xkx';
    return;
  }

  afterAuth();
})();

function bindReferral(openid) {
  var refCode = '';
  try { refCode = localStorage.getItem('referral_code') || ''; } catch(e){}
  if (!refCode || !openid) return;
  fetch('/api/referral/bind', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({referee_openid: openid, referral_code: refCode, referee_nickname: userInfo.nickname || ''})
  }).then(function(r){return r.json()}).then(function(d){
    localStorage.removeItem('referral_code');
  }).catch(function(){});
}

function showProfile() {
  document.getElementById('profileCard').classList.add('show');
  document.getElementById('userNickname').textContent = userInfo.nickname || '';
  if (userInfo.avatar) {
    document.getElementById('userAvatar').src = userInfo.avatar;
  } else {
    document.getElementById('userAvatar').style.display = 'none';
  }
}

function checkMembership(openid) {
  if (!openid) return;
  fetch('/api/member-status?openid=' + encodeURIComponent(openid))
  .then(function(r){return r.json()})
  .then(function(m){
    if (m.status === 'active' || m.status === 'expiring') {
      var btn = document.getElementById('botCta').querySelector('button');
      var title = document.getElementById('pageTitle');
      title.textContent = '欢迎回来，享客虾会员 🦞';
      btn.textContent = '🦞 继续使用享客虾';
      // 显示会员信息条
      var infoHtml = '<div style="background:rgba(212,168,71,0.08);border:1px solid rgba(212,168,71,0.15);border-radius:12px;padding:14px 16px;margin-bottom:16px;text-align:left;">'
        + '<div style="font-size:13px;font-weight:600;color:#b89230;">🎉 会员有效</div>'
        + '<div style="font-size:12px;color:#666;margin-top:6px;">到期：' + (m.expires_at || '') + ' ｜ 剩余 ' + m.days_left + ' 天</div>'
        + '</div>';
      var msg = document.getElementById('statusMsg');
      msg.innerHTML = infoHtml;
      msg.className = 'msg';
      msg.style.display = 'block';
    }
  })
  .catch(function(){});
}

function afterAuth() {
  // 如果已获取 openid，先查是否已绑 Bot
  if (userInfo.openid) {
    fetch('/api/bot/check-bound?openid=' + encodeURIComponent(userInfo.openid))
      .then(function(r){return r.json()})
      .then(function(d){
        if (d.bound) {
          // 已绑定 → 直接跳 Bot 聊天
          showMsg('info', '已在列表，跳转聊天...');
          jumpToBot();
        } else {
          showAddBotFlow();
        }
      })
      .catch(function(){ showAddBotFlow(); });
  } else {
    showAddBotFlow();
  }
}

function showAddBotFlow() {
  if (isInWx) {
    document.getElementById('botCta').classList.add('show');
    prefetchLiteapp();
  } else {
    document.getElementById('qrBox').classList.add('show');
    loadQr();
  }
}

function jumpToBot() {
  // 已绑用户 → 推一条写歌消息到 Bot 聊天
  var msg = document.getElementById('statusMsg');
  if (msg) {
    msg.innerHTML = '<div style="font-size:15px;color:#27AE60">🦞 已绑定，点开聊天即可使用</div>';
    msg.className = 'msg success';
    msg.style.display = 'block';
  }
  var cta = document.getElementById('botCta');
  if (cta) cta.style.display = 'none';
  // 推送写歌消息到 Bot
  fetch('/api/bot/push-write-song', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      openid: userInfo.openid || '',
      nickname: userInfo.nickname || '虾友'
    })
  }).catch(function(){});
}

function prefetchLiteapp() {
  var nick = encodeURIComponent(userInfo.nickname || '');
  var oid = encodeURIComponent(userInfo.openid || '');
  // 预取 liteapp 链接，点击按钮时直接跳
  fetch('/api/bot/qrcode/session?nickname=' + nick + '&openid=' + oid)
  .then(function(r){return r.json()})
  .then(function(d){
    if (d.qrcode_url) {
      // 存到 data 属性，点击时跳转
      document.getElementById('botCta').querySelector('button').dataset.liteapp = d.qrcode_url;
    }
  })
  .catch(function(){});
}

function addBotDirect() {
  var btn = document.getElementById('botCta').querySelector('button');
  var url = btn.dataset.liteapp;
  if (url) {
    // 直接打开 liteapp 链接 → 微信打开 Bot 聊天页
    window.location.href = url;
  } else {
    // fallback: 调 QR session 拿链接
    showMsg('info', '正在获取 Bot 链接...');
    var nick = encodeURIComponent(userInfo.nickname || '');
    var oid = encodeURIComponent(userInfo.openid || '');
    fetch('/api/bot/qrcode/session?nickname=' + nick + '&openid=' + oid)
    .then(function(r){return r.json()})
    .then(function(d){
      if (d.qrcode_url) {
        window.location.href = d.qrcode_url;
      } else {
        showMsg('error', '获取 Bot 链接失败，请重试');
      }
    })
    .catch(function(){
      showMsg('error', '网络错误，请重试');
    });
  }
}

// ── 二维码（非微信 fallback）──
function loadQr() {
  var nick = encodeURIComponent(userInfo.nickname || '');
  var oid = encodeURIComponent(userInfo.openid || '');
  fetch('/api/bot/qrcode/session?nickname=' + nick + '&openid=' + oid)
  .then(function(r){return r.json()})
  .then(function(d){
    if (!d.qrcode_url) {
      document.getElementById('qrLoading').textContent = '生成失败，请刷新重试';
      return;
    }
    return fetch('/api/bot/qrcode/image?value=' + encodeURIComponent(d.qrcode_url));
  })
  .then(function(r){return r.blob()})
  .then(function(blob){
    document.getElementById('qrImg').src = URL.createObjectURL(blob);
    document.getElementById('qrImg').style.display = 'block';
    document.getElementById('qrLoading').style.display = 'none';
  })
  .catch(function(){
    document.getElementById('qrLoading').textContent = '网络错误，请刷新';
  });
}

function showMsg(type, text) {
  var el = document.getElementById('statusMsg');
  el.className = 'msg ' + type;
  el.textContent = text;
  el.style.display = 'block';
}
</script>
</body>
</html>
