<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>推广享客虾 — 享客虾推广计划</title>
<meta name="description" content="享客虾，虾客行。邀请好友，赚虾点奖励。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#f5f0e8;
  font-family:-apple-system,"Noto Serif CJK SC","Noto Sans SC",serif;
  min-height:100vh;
  padding:36px 20px 60px;
  text-align:center;
}
.logo{font-size:56px;margin-bottom:2px}
.brand{font-size:24px;font-weight:700;color:#5B8C3E;margin-bottom:2px}
.slogan{font-size:14px;color:#8a7a64;margin-bottom:4px}
.subtitle{font-size:13px;color:#bbb5a8;margin-bottom:18px}
.line{width:50px;height:2px;background:#5B8C3E;margin:0 auto 22px;border-radius:1px}
.card{
  background:#fffdf7;
  border-radius:16px;
  padding:22px 20px;
  max-width:420px;
  width:100%;
  margin:0 auto 10px;
  box-shadow:0 2px 12px rgba(0,0,0,0.06);
  text-align:left;
}
.card h3{font-size:16px;color:#333;margin-bottom:8px}
.card p,.card li{font-size:13px;color:#666;line-height:1.8}
.card ul{padding-left:18px}
.tag{
  display:inline-block;
  font-size:11px;
  background:#5B8C3E;color:#fff;
  padding:3px 10px;
  border-radius:10px;
  margin-bottom:6px;
}
.btn{
  display:inline-block;
  background:#5B8C3E;color:#fff;
  border:none;border-radius:12px;
  padding:14px 32px;
  font-size:15px;font-weight:600;
  text-decoration:none;
  cursor:pointer;
  margin-top:12px;
  transition:opacity .2s;
}
.btn:active{opacity:.7}
.btn-block{display:block;text-align:center}
.btn-outline{
  background:#fffdf7;color:#5B8C3E;
  border:1.5px solid #5B8C3E;
  margin-top:8px;
}
.stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin:12px 0;
}
.stat-box{
  background:#f5f0e8;
  border-radius:10px;
  padding:12px 8px;
  text-align:center;
}
.stat-box .num{font-size:22px;font-weight:700;color:#5B8C3E}
.stat-box .label{font-size:10px;color:#8a7a64;margin-top:3px}
.link-box{
  background:#f5f0e8;
  border-radius:10px;
  padding:12px 14px;
  margin:10px 0;
  word-break:break-all;
  font-size:12px;
  color:#5B8C3E;
  text-align:center;
  cursor:pointer;
}
.link-box:active{opacity:.6}
.footer{font-size:11px;color:#bbb5a8;margin-top:28px}
</style>
</head>
<body>

      保存二维码 → 打开微信 → 扫一扫 → 关注

</div>

<div class="card" id="statsCard">
  <div class="tag">推广战绩</div>
  <h3 id="statsTitle">加载中...</h3>
  <div id="statsContent">
    <p style="font-size:13px;color:#999;line-height:1.8;text-align:center;padding:8px 0;">
      <span id="loadingText">正在获取推广信息...</span>
    </p>
  </div>
</div>

<div class="footer">
  享客虾 · 智享家
</div>

<script>
const params = new URLSearchParams(window.location.search);
const openid = params.get('openid');
const avatar = params.get('avatar') || '';
const isWechat = /MicroMessenger/i.test(navigator.userAgent);

if (openid) {
  document.getElementById('statsCard').style.display = 'block';
  var apiUrl = '/api/referral/info?openid=' + openid;
  if (avatar) apiUrl += '&avatar=' + encodeURIComponent(avatar);
  fetch(apiUrl)
    .then(r => r.json())
    .then(data => {
      if (data.referral_count !== undefined) {
        document.getElementById('statsTitle').textContent = '我的推广战绩';
        const code = data.referral_code || data.code || '';
        document.getElementById('statsContent').innerHTML = 
          '<div class="stats-grid">' +
            '<div class="stat-box"><div class="num">' + (data.referral_count || 0) + '</div><div class="label">邀请人数</div></div>' +
            '<div class="stat-box"><div class="num">' + ((data.total_commission || 0).toLocaleString()) + '</div><div class="label">累计虾点</div></div>' +
            '<div class="stat-box"><div class="num">' + (data.level2_count || 0) + '</div><div class="label">二级邀请</div></div>' +
          '</div>' +
          '<a href="/promo/poster?code=' + code + '" class="btn btn-block" style="margin-bottom:6px;">📷 我的推广海报</a>' +
          '<div class="link-box" id="refLink" onclick="copyLink(this)">' +
            'ai.pangoozn.com/xkx/bind?ref=' + code +
          '</div>' +
          '<p style="font-size:11px;color:#aaa;text-align:center;margin-top:4px;">👆 点击复制推广链接</p>';
      } else {
        document.getElementById('statsTitle').textContent = '开始推广';
        document.getElementById('statsContent').innerHTML =
          '<p style="font-size:14px;color:#333;line-height:1.8;text-align:center;padding:4px 0;">' +
          '你还没有添加享客虾 Bot<br>' +
          '添加后才能获得专属推广链接和海报</p>' +
          '<a href="https://ai.pangoozn.com/xkx/bind?ref=new" class="btn btn-block">📱 添加享客虾 Bot</a>' +
          '<p style="font-size:11px;color:#aaa;text-align:center;margin-top:8px;">添加后即可生成海报 · 分享赚虾点</p>';
      }
    })
    .catch(() => {
      document.getElementById('statsTitle').textContent = '获取失败';
      document.getElementById('statsContent').innerHTML = '<p style="font-size:13px;color:#999;text-align:center;">请稍后重试</p>';
    });
} else if (isWechat) {
  window.location.href = 'https://ai.pangoozn.com/api/auth/wechat-redirect?target=/promo';
} else {
  document.getElementById('nonWechat').style.display = 'block';
}

function copyLink(el) {
  const text = el.textContent.trim();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      el.style.background = '#e8f5e0';
      setTimeout(() => el.style.background = '#f5f0e8', 1500);
    });
  }
}
</script>
