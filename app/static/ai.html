<!DOCTYPE html>
<html lang=zh-CN>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>微侠 AI 助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0f0f1a;color:#e0e0e0;height:100vh;display:flex;flex-direction:column}
header{background:#1a1a2e;padding:12px 20px;border-bottom:1px solid #2a2a40;display:flex;align-items:center;gap:10px}
header h1{font-size:16px;color:#4a6cf7}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 16px;border-radius:12px;line-height:1.6;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:#4a6cf7;color:#fff;border-bottom-right-radius:4px}
.assistant{align-self:flex-start;background:#1e1e36;color:#e0e0e0;border-bottom-left-radius:4px}
.assistant pre{background:#0a0a15;padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0}
.input-area{display:flex;padding:12px 20px;gap:8px;border-top:1px solid #2a2a40;background:#0a0a16}
.input-area input{flex:1;padding:10px 14px;border-radius:8px;border:1px solid #333;background:#1a1a2e;color:#e0e0e0;font-size:14px;outline:none}
.input-area input:focus{border-color:#4a6cf7}
.input-area button{padding:10px 16px;border-radius:8px;border:none;font-size:14px;cursor:pointer}
#sendBtn{background:#4a6cf7;color:#fff}
#voiceBtn{background:#2d2d50;color:#e0e0e0;width:40px;font-size:18px}
#voiceBtn.listening{background:#f44336;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.thinking{color:#888;padding:8px 12px;align-self:flex-start}
</style>
</head>
<body>
<header><h1>🎤 微侠 AI 助手</h1><span>中文输入 · 语音输入</span></header>
<div id=chat>
<div class=assistant style="align-self:center;text-align:center;color:#666;padding:40px;">
<h2 style=color:#4a6cf7>微侠 AI 助手</h2>
<p>打字或点击 🎤 语音输入</p>
</div>
</div>
<div class=input-area>
<input id=input type=text placeholder="输入消息..." autofocus>
<button id=voiceBtn onclick=toggleVoice()>🎤</button>
<button id=sendBtn onclick=send()>发送</button>
</div>
<script>
const API="/api/message";const chat=document.getElementById("chat");
const input=document.getElementById("input");let listening=false,recognition=null;

if(window.SpeechRecognition||window.webkitSpeechRecognition){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();recognition.lang="zh-CN";recognition.continuous=false;recognition.interimResults=false;
  recognition.onresult=function(e){input.value=e.results[0][0].transcript;send()};
  recognition.onend=function(){document.getElementById("voiceBtn").className="";listening=false};
}

function toggleVoice(){
  if(!recognition){alert("请用 Chrome/Edge 浏览器");return}
  if(listening){recognition.stop();return}
  recognition.start();listening=true;
  document.getElementById("voiceBtn").className="listening"
}

async function send(){
  const t=input.value.trim();if(!t)return;input.value="";
  document.getElementById("sendBtn").disabled=true;
  chat.innerHTML+='<div class="msg user">'+t.replace(/</g,"&lt;")+"</div>";
  chat.innerHTML+='<div class="thinking">思考中...</div>';chat.scrollTop=chat.scrollHeight;
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({bot_id:"web_ai",from_user:"web",text:t,msg_id:Math.random().toString(36).slice(2)})});
    const d=await r.json(),reply=(d.reply||d.response||"").trim();
    chat.querySelector(".thinking")?.remove();
    chat.innerHTML+='<div class="msg assistant">'+reply.replace(/\n/g,"<br>")+"</div>"
  }catch(e){
    chat.querySelector(".thinking")?.remove();
    chat.innerHTML+='<div class="msg assistant">❌ '+e.message+"</div>"
  }
  document.getElementById("sendBtn").disabled=false;chat.scrollTop=chat.scrollHeight
}
input.addEventListener("keydown",function(e){if(e.key=="Enter")send()});
</script>
</body>
</html>
