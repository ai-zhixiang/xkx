<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>绑定手机 · 享客虾</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f0e8;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#3a3226;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fffdf7;border-radius:16px;padding:32px 24px;width:360px;max-width:92vw;box-shadow:0 4px 20px rgba(120,90,40,0.1);text-align:center}
.card .logo{font-size:48px;margin-bottom:8px}
.card h1{font-size:20px;font-weight:700;color:#4A7C59;margin-bottom:4px}
.card p{font-size:13px;color:#8a7a64;margin-bottom:20px}
.input-group{margin-bottom:12px;text-align:left}
.input-group label{font-size:12px;color:#6a5e4e;display:block;margin-bottom:4px}
.input-group input{width:100%;padding:12px;border:1px solid rgba(180,140,80,0.2);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;outline:none}
.input-group input:focus{border-color:#4A7C59}
.input-row{display:flex;gap:8px}
.input-row input{flex:1}
.input-row button{width:110px;padding:12px;border:none;border-radius:10px;background:#4A7C59;color:#fff;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap}
.input-row button:disabled{opacity:0.5}
.btn-submit{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#4A7C59,#3A6648);color:#fff;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px}
.btn-submit:disabled{opacity:0.5}
.msg{margin-top:12px;font-size:13px;padding:10px 12px;border-radius:8px;display:none}
.msg.ok{display:block;background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7}
.msg.err{display:block;background:#FFEBEE;color:#C62828;border:1px solid #EF9A9A}
.msg.info{display:block;background:#E3F2FD;color:#1565C0;border:1px solid #90CAF9}
.benefits{text-align:left;margin:16px 0;padding:12px;background:#F1F8E9;border-radius:10px;font-size:12px;color:#558B2F;display:none}
.benefits.show{display:block}
.benefits li{margin:4px 0;list-style:none}
.benefits li:before{content:"✅ ";margin-right:4px}
.hint{font-size:11px;color:rgba(120,105,85,0.5);margin-top:12px}
</style>
</head>
<body>
<div class="card">
<div class="logo">🦞</div>
<h1>绑定手机号</h1>
<p>绑定后数据共享 · 防丢失</p>
<div class="input-group">
<label>手机号</label>
<input type="tel" id="phoneInput" placeholder="请输入手机号" maxlength="11" autocomplete="tel">
</div>
<div class="input-row">
<input type="text" id="codeInput" placeholder="验证码" maxlength="6" autocomplete="one-time-code">
<button id="sendCodeBtn" onclick="sendCode()">获取验证码</button>
</div>
<button class="btn-submit" id="submitBtn" onclick="doBind()">绑定</button>
<div class="msg" id="msg"></div>
<div class="benefits" id="benefits">
  <strong>绑定后可享受：</strong>
  <li>同一手机号下的所有 bot 文件互通</li>
  <li>换新 bot 后绑定原手机号即可恢复数据</li>
  <li>查看「我的账户」了解绑定状态</li>
</div>
<div class="hint">会员仍跟随原 bot，手机号仅用于数据打通</div>
</div>
<script>
// Get URL params
var params={};location.search.replace(/[?&]([^=]+)=([^&]*)/g,function(_,k,v){params[k]=decodeURIComponent(v)});
var BOT_ID=params.bot_id||'', CUID=params.channel_user_id||'';
var PHONE='', CODE='', timer=0;

function $(id){return document.getElementById(id)}
function msg(t,c){var el=$('msg');el.textContent=t;el.className='msg '+(c||'ok');el.style.display='block'}
function hideMsg(){$('msg').style.display='none'}

function sendCode(){
  var p=$('phoneInput').value.trim();
  if(p.length<7){msg('请输入有效手机号','err');return}
  PHONE=p;
  // Call auth-center SMS API
  fetch('/api/auth/send-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:p})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.ok!==false){msg('验证码已发送','info');startCountdown()}
    else{msg(d.msg||d.detail||'发送失败','err')}
  }).catch(function(){msg('网络错误，请重试','err')});
}

function startCountdown(){
  var btn=$('sendCodeBtn');
  var sec=60;btn.disabled=true;
  timer=setInterval(function(){sec--;btn.textContent=sec+'s';if(sec<=0){clearInterval(timer);btn.disabled=false;btn.textContent='重新发送'}},1000)
}

function doBind(){
  var c=$('codeInput').value.trim();
  if(!c||c.length<4){msg('请输入验证码','err');return}
  if(!PHONE)PHONE=$('phoneInput').value.trim();
  CODE=c;
  var btn=$('submitBtn');btn.disabled=true;btn.textContent='绑定中...';
  hideMsg();
  // Step 1: Verify code
  fetch('/api/auth/verify-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:PHONE,code:CODE})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.ok!==false){
      // Step 2: Bind bot to phone via accounts API
      return fetch('/api/accounts/bind',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bot_id:BOT_ID,phone:PHONE,channel_user_id:CUID})});
    }else{
      throw new Error(d.detail||'验证码错误');
    }
  }).then(function(r){return r.json()}).then(function(d){
    if(d.status==='ok'){
      msg('绑定成功！','ok');
      $('benefits').className='benefits show';
      btn.textContent='✅ 已绑定';
    }else{
      msg(d.message||'绑定失败，请重试','err');
      btn.disabled=false;btn.textContent='绑定';
    }
  }).catch(function(e){
    msg(e.message||'网络错误','err');
    btn.disabled=false;btn.textContent='绑定';
  });
}
</script>
</body>
</html>
